name: Build

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
    paths-ignore: ['*.md']
    branches: ['master']

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # `edited` also fires on title and body edits; only a base change matters.
    if: >-
      github.event.pull_request.draft == false
      && (github.event.action != 'edited' || github.event.changes.base.ref.from != '')
    uses: Start9Labs/start-technologies/.github/workflows/build.yml@master
    # No DEV_KEY — a PR build doesn't publish, so it doesn't need the signing key.
